<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendStore - Best Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-pink-600 text-white p-4 shadow text-center font-bold text-xl">
        🛍️ TrendStore - Cash on Delivery Available
    </header>

    <div class="max-w-6xl mx-auto p-4">
        <h2 class="text-xl font-bold mb-4 text-gray-800">Trending Products</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            {% for product in products %}
            <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col justify-between">
                <img src="{{ product.primary_image }}" class="w-full h-48 object-cover">
                <div class="p-3">
                    <h3 class="font-semibold text-gray-800 text-sm truncate">{{ product.title }}</h3>
                    <div class="mt-2 flex items-center space-x-2">
                        <span class="text-lg font-bold text-gray-900">₹{{ product.price }}</span>
                        <span class="text-xs text-gray-400 line-through">₹{{ product.original_price }}</span>
                        <span class="text-xs text-green-600 font-bold">Free Delivery</span>
                    </div>
                    <a href="{% url 'product_detail' product.pk %}" class="mt-3 block text-center bg-pink-600 text-white py-2 rounded text-sm font-semibold hover:bg-pink-700">
                        Buy Now (COD)
                    </a>
                </div>
            </div>
            {% empty %}
            <p class="text-gray-500 col-span-4 text-center py-8">Kono product upload kora nei. Admin panel theke add koro!</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
